name: Build iOS app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/Herzenssache.xcodeproj
          -scheme Herzenssache
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          build
